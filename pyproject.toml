[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ink-verify"
version = "0.1.0"
description = "Formally verify properties of Ink interactive fiction stories using Z3"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "z3-solver>=4.12",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ink-verify = "ink_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ink_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
